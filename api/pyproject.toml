[project]
name = "priatelia-api"
version = "0.1.0"
description = "FastAPI backend for Priatelia"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=3.0.2",
    "alembic>=1.13.3",
    "fastapi>=0.115.0",
    "minio>=7.2.8",
    "psycopg[binary,pool]>=3.2.3",
    "pydantic[email]>=2.9.2",
    "pydantic-settings>=2.6.1",
    "pwdlib[argon2]>=0.2.1",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.2",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
