<!doctype html>
<html lang="sk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
  </head>
  <body style="margin:0; padding:0; background:#f4f0ea; font-family:Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#171717;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f0ea; margin:0; padding:28px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px; background:#ffffff; border:1px solid #e7d9c8; border-radius:18px; overflow:hidden;">
            <tr>
              <td style="background:#26396f; padding:22px 28px;">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                  <tr>
                    <td align="center" style="vertical-align:middle; padding:0;">
                      <table role="presentation" cellspacing="0" cellpadding="0" align="center">
                        <tr>
                          <td style="vertical-align:middle; padding:0 6px 0 0;">
                            <img src="{{ logo_url }}" width="41" height="35" alt="" style="display:block; width:41px; height:35px; border:0;">
                          </td>
                          <td style="vertical-align:middle; color:#ffffff; font-family:'Comic Sans MS', 'Comic Neue', 'Trebuchet MS', Verdana, sans-serif; font-size:24px; line-height:1; font-weight:400; letter-spacing:3px; text-shadow:none; -webkit-text-stroke:0.5px #ffffff; paint-order:stroke fill;">{{ app_name }}</td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            {% block content %}{% endblock %}
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
