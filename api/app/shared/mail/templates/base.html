<!doctype html>
<html lang="sk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
  </head>
  <body style="margin:0; padding:0; background:{{ mail_theme.colors.app.white }}; font-family:Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:{{ mail_theme.colors.app.text }};">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:{{ mail_theme.colors.app.white }}; margin:0; padding:28px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px; background:{{ mail_theme.colors.app.white }}; border:1px solid {{ mail_theme.colors.app.borderColorStrong }}; border-radius:18px; overflow:hidden;">
            <tr>
              <td style="background:{{ mail_theme.colors.app.base }}; padding:22px 28px;">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                  <tr>
                    <td align="center" style="vertical-align:middle; padding:0;">
                      <table role="presentation" cellspacing="0" cellpadding="0" align="center">
                        <tr>
                          <td style="vertical-align:middle; padding:0 6px 0 0;">
                            <img src="{{ logo_url }}" width="41" height="35" alt="" style="display:block; width:41px; height:35px; border:0;">
                          </td>
                          <td style="vertical-align:middle; color:{{ mail_theme.colors.app.white }}; font-family:'Comic Sans MS', 'Comic Neue', 'Trebuchet MS', Verdana, sans-serif; font-size:24px; line-height:1; font-weight:400; letter-spacing:3px; text-shadow:none; -webkit-text-stroke:0.5px {{ mail_theme.colors.app.white }}; paint-order:stroke fill;">{{ app_name }}</td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            {% block content %}{% endblock %}
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
