services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
      args:
        VITE_DATA_SOURCE: rest
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-4445}:80"
    depends_on:
      - api

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql://priatelia:priatelia@database:5432/priatelia}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-43200}
      WEB_APP_URL: ${WEB_APP_URL:-https://priatelia.wondercules.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-["https://priatelia.wondercules.com"]}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      MEDIA_ENDPOINT: ${MEDIA_ENDPOINT:-media:9000}
      MEDIA_ACCESS_KEY: ${MEDIA_ACCESS_KEY}
      MEDIA_SECRET_KEY: ${MEDIA_SECRET_KEY}
      MEDIA_BUCKET: ${MEDIA_BUCKET:-profile-photos}
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-https://priatelia.wondercules.com/profile-photos}
      MEDIA_SECURE: ${MEDIA_SECURE:-false}
      NOTIFICATION_WORKER_BATCH_SIZE: ${NOTIFICATION_WORKER_BATCH_SIZE:-10}
      NOTIFICATION_WORKER_POLL_SECONDS: ${NOTIFICATION_WORKER_POLL_SECONDS:-2.0}
      NOTIFICATION_WORKER_MAX_ATTEMPTS: ${NOTIFICATION_WORKER_MAX_ATTEMPTS:-5}
      NOTIFICATION_WORKER_PROCESSING_TIMEOUT_SECONDS: ${NOTIFICATION_WORKER_PROCESSING_TIMEOUT_SECONDS:-300}
    depends_on:
      database:
        condition: service_healthy
      media:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully

  notification-worker:
    build:
      context: ./api
      dockerfile: Dockerfile.prod
    command: python -m app.modules.notifications.worker
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql://priatelia:priatelia@database:5432/priatelia}
      WEB_APP_URL: ${WEB_APP_URL:-https://priatelia.wondercules.com}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      NOTIFICATION_WORKER_BATCH_SIZE: ${NOTIFICATION_WORKER_BATCH_SIZE:-10}
      NOTIFICATION_WORKER_POLL_SECONDS: ${NOTIFICATION_WORKER_POLL_SECONDS:-2.0}
      NOTIFICATION_WORKER_MAX_ATTEMPTS: ${NOTIFICATION_WORKER_MAX_ATTEMPTS:-5}
      NOTIFICATION_WORKER_PROCESSING_TIMEOUT_SECONDS: ${NOTIFICATION_WORKER_PROCESSING_TIMEOUT_SECONDS:-300}
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-priatelia}
      POSTGRES_USER: ${POSTGRES_USER:-priatelia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - priatelia_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U priatelia -d priatelia"]
      interval: 5s
      timeout: 5s
      retries: 10

  media:
    image: minio/minio:latest
    command: server /data
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MEDIA_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MEDIA_SECRET_KEY}
    volumes:
      - priatelia_media:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  media-init:
    image: minio/mc:latest
    depends_on:
      media:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://media:9000 ${MEDIA_ACCESS_KEY} ${MEDIA_SECRET_KEY}
        mc mb --ignore-existing local/${MEDIA_BUCKET:-profile-photos}
        mc anonymous set download local/${MEDIA_BUCKET:-profile-photos}

volumes:
  priatelia_database:
  priatelia_media:
