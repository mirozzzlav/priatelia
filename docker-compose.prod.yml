services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
      args:
        VITE_DATA_SOURCE: rest
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-4445}:80"
    depends_on:
      - api

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
      media:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully

  notification-worker:
    build:
      context: ./api
      dockerfile: Dockerfile.prod
    command: python -m app.modules.notifications.worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-priatelia}
      POSTGRES_USER: ${POSTGRES_USER:-priatelia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - priatelia_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U priatelia -d priatelia"]
      interval: 5s
      timeout: 5s
      retries: 10

  media:
    image: minio/minio:latest
    command: server /data
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MEDIA_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MEDIA_SECRET_KEY}
    volumes:
      - priatelia_media:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  media-init:
    image: minio/mc:latest
    depends_on:
      media:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://media:9000 ${MEDIA_ACCESS_KEY} ${MEDIA_SECRET_KEY}
        mc mb --ignore-existing local/${MEDIA_BUCKET:-profile-photos}
        mc anonymous set download local/${MEDIA_BUCKET:-profile-photos}

volumes:
  priatelia_database:
  priatelia_media:
