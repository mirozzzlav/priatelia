map $http_user_agent $is_social_bot {
    default 0;
    ~*(facebookexternalhit|facebot|twitterbot|linkedinbot|slackbot|discordbot|telegrambot|whatsapp|pinterest|redditbot|skypeuripreview|mastodon|threads) 1;
}

map $uri $is_static_request {
    default 0;
    ~*\.(?:avif|css|gif|ico|jpeg|jpg|js|json|mjs|png|svg|txt|webp|woff|woff2|xml)$ 1;
}

map "$is_social_bot:$is_static_request" $serve_social_preview {
    default 0;
    "1:0" 1;
}

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=1s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20M;

    location /api/ {
        set $api_upstream api:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /profile-photos/ {
        set $media_upstream media:9000;
        proxy_pass http://$media_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /social-preview.html {
        add_header Cache-Control "public, max-age=300";
        try_files /social-preview.html =404;
    }

    location / {
        if ($serve_social_preview) {
            rewrite ^ /social-preview.html last;
        }

        try_files $uri $uri/ /index.html;
    }
}
