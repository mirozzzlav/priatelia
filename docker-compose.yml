services:
  web:
    build: ./web
    ports:
      - "4444:4444"
    environment:
      VITE_DATA_SOURCE: rest
      VITE_API_BASE_URL: http://localhost:3000
    depends_on:
      - api
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules

  api:
    build: ./api
    ports:
      - "3000:3000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://priatelia:priatelia@database:5432/priatelia
      JWT_SECRET: change-me-in-production
      JWT_ALGORITHM: HS256
      JWT_EXPIRES_MINUTES: 43200
      WEB_APP_URL: http://localhost:4444
      CORS_ORIGINS: '["http://localhost:4444","http://127.0.0.1:4444","http://localhost:5173","http://127.0.0.1:5173"]'
      SMTP_HOST: mailpit
      SMTP_PORT: 1026
      SMTP_FROM: noreply@priatelia.local
      MEDIA_ENDPOINT: media:9000
      MEDIA_ACCESS_KEY: priatelia
      MEDIA_SECRET_KEY: priatelia
      MEDIA_BUCKET: profile-photos
      MEDIA_PUBLIC_URL: http://localhost:9000/profile-photos
      MEDIA_SECURE: "false"
    depends_on:
      database:
        condition: service_healthy
      media:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    volumes:
      - ./api:/app

  notification-worker:
    build: ./api
    command: python -m app.modules.notifications.worker
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://priatelia:priatelia@database:5432/priatelia
      WEB_APP_URL: http://localhost:4444
      SMTP_HOST: mailpit
      SMTP_PORT: 1026
      SMTP_FROM: noreply@priatelia.local
    depends_on:
      database:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - ./api:/app

  database:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: priatelia
      POSTGRES_USER: priatelia
      POSTGRES_PASSWORD: priatelia
    volumes:
      - priatelia_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U priatelia -d priatelia"]
      interval: 5s
      timeout: 5s
      retries: 10

  media:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: priatelia
      MINIO_ROOT_PASSWORD: priatelia
    volumes:
      - priatelia_media:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  media-init:
    image: minio/mc:latest
    depends_on:
      media:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://media:9000 priatelia priatelia
        mc mb --ignore-existing local/profile-photos
        mc anonymous set download local/profile-photos

  mailpit:
    image: axllent/mailpit:latest
    command: ["--smtp", "0.0.0.0:1026"]
    ports:
      - "1026:1026"
      - "8025:8025"

volumes:
  priatelia_database:
  priatelia_media:
  web_node_modules:
