services:
  web:
    build: ./web
    ports:
      - "${WEB_PORT:-4444}:4444"
    environment:
      VITE_DATA_SOURCE: ${VITE_DATA_SOURCE:-rest}
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://api:3000
      VITE_MEDIA_PROXY_TARGET: ${VITE_MEDIA_PROXY_TARGET:-http://media:9000}
    depends_on:
      - api
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules

  api:
    build: ./api
    ports:
      - "${API_PORT:-3000}:3000"
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
      media:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    volumes:
      - ./api:/app

  notification-worker:
    build: ./api
    command: python -m app.modules.notifications.worker
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - ./api:/app

  database:
    image: postgres:16
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-priatelia}
      POSTGRES_USER: ${POSTGRES_USER:-priatelia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-priatelia}
    volumes:
      - priatelia_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U priatelia -d priatelia"]
      interval: 5s
      timeout: 5s
      retries: 10

  media:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "${MEDIA_API_PORT:-9000}:9000"
      - "${MEDIA_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MEDIA_ACCESS_KEY:-priatelia}
      MINIO_ROOT_PASSWORD: ${MEDIA_SECRET_KEY:-priatelia}
    volumes:
      - priatelia_media:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  media-init:
    image: minio/mc:latest
    depends_on:
      media:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://media:9000 ${MEDIA_ACCESS_KEY:-priatelia} ${MEDIA_SECRET_KEY:-priatelia}
        mc mb --ignore-existing local/${MEDIA_BUCKET:-profile-photos}
        mc anonymous set download local/${MEDIA_BUCKET:-profile-photos}

  mailpit:
    image: axllent/mailpit:latest
    command: ["--smtp", "0.0.0.0:1026"]
    ports:
      - "${MAILPIT_SMTP_PORT:-1026}:1026"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  priatelia_database:
  priatelia_media:
  web_node_modules:
